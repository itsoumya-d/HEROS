name: Contract CI
on:
  push:
    paths:
      - "packages/contract-agent/**"
      - ".github/workflows/contract-ci.yml"
  pull_request:
    paths:
      - "packages/contract-agent/**"
      - ".github/workflows/contract-ci.yml"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm run test:contract
