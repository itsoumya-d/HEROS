[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heros-rlvr"
version = "0.1.0"
description = "Verifiable-reasoning post-training primitives: GRPO, Dr.GRPO, DAPO, verifier audit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Soumya Debnath" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
